<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stripe Connect Business Dashboard | FillSpace</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/connect.css">
</head>
<body class="connect-sample-page">
  <main class="section">
    <div class="container connect-shell">
      <a class="inline-link" href="index.html">← Back to FillSpace</a>
      <h1>Sample Connect Business | Dashboard</h1>
      <p>Use this page to test Stripe Connect account onboarding, product creation, and hosted checkout.</p>

      <form id="create-account-form" class="connect-card">
        <h2>Create connected account</h2>
        <label for="email">Email for connected account</label>
        <input type="email" id="email" required placeholder="owner@example.com">
        <button class="btn btn-primary" type="submit">Create Connect Account</button>
      </form>

      <div id="account-status" class="connect-card"></div>

      <button id="add-product" class="btn btn-secondary hidden" type="button">Add New Product</button>
      <form id="create-product-form" class="connect-card hidden">
        <h2>Create product</h2>
        <label for="productName">Product name</label>
        <input type="text" id="productName" required>

        <label for="productDescription">Description</label>
        <input type="text" id="productDescription">

        <label for="productPrice">Price (in cents)</label>
        <input type="number" id="productPrice" value="1000" min="50" required>

        <button type="submit" class="btn btn-primary">Create Product</button>
      </form>

      <section id="products-section" class="connect-card hidden">
        <div class="inline-actions">
          <h2>Products</h2>
          <button id="toggle-products" class="btn btn-secondary" type="button">Show Products</button>
        </div>
        <div id="products-list" class="hidden">
          <article class="product hidden">
            <div class="product-info">
              <img class="product-image" src="https://i.imgur.com/6Mvijcm.png" alt="Product icon">
              <div class="description">
                <h3 class="product-name">Product name</h3>
                <h5 class="product-price">$0.00</h5>
              </div>
            </div>
            <form action="/api/create-checkout-session" method="POST" class="checkout-form">
              <input type="hidden" name="priceId" value="">
              <input type="hidden" name="accountId" value="">
              <button type="submit" class="btn btn-primary">Checkout</button>
            </form>
          </article>
        </div>
      </section>

      <div id="storefronts"></div>
    </div>
  </main>

  <script type="module" src="assets/js/connect.js"></script>
</body>
</html>
